const CAPITALS = {
  "Alberta": "Edmonton", "British Columbia": "Victoria", "Manitoba": "Winnipeg",
  "New Brunswick": "Fredericton", "Newfoundland and Labrador": "St. John's",
  "Northwest Territories": "Yellowknife", "Nova Scotia": "Halifax", "Nunavut": "Iqaluit",
  "Ontario": "Toronto", "Prince Edward Island": "Charlottetown", "Quebec": "Quebec City",
  "Saskatchewan": "Regina", "Yukon": "Whitehorse"
};
const $ = id => document.getElementById(id);
const svg = $("map"), NS = "http://www.w3.org/2000/svg";
const names = Object.keys(MAP.paths);
const paths = {};
for (const n of names) {
  const p = document.createElementNS(NS, "path");
  p.setAttribute("d", MAP.paths[n]);
  p.addEventListener("click", () => answer(n));
  svg.appendChild(p);
  paths[n] = p;
}

let queue = [], current = null, done = 0, running = false, timerId = null;

$("mode").onchange = () => $("secWrap").hidden = $("mode").value !== "strict";
$("sec").oninput = () => $("secVal").textContent = $("sec").value;
$("start").onclick = start;

function start() {
  clearTimeout(timerId);
  for (const n of names) paths[n].setAttribute("class", "");
  queue = [...names].sort(() => Math.random() - 0.5);
  done = 0; running = true;
  $("msg").textContent = "";
  next();
}

function label(n) { return $("what").value === "cap" ? "Where is " + CAPITALS[n] + "?" : "Click " + n; }

function next() {
  if (!queue.length) {
    running = false;
    $("q").textContent = "You got them all!";
    $("msg").textContent = "Perfect run. Press Start to go again.";
    $("timer").style.transition = "none"; $("timer").style.width = "0";
    return;
  }
  current = queue.pop();
  $("q").textContent = label(current);
  $("score").textContent = done + " / " + names.length;
  if ($("mode").value === "strict") {
    const t = $("timer"), s = +$("sec").value;
    t.style.transition = "none"; t.style.width = "100%"; t.getBoundingClientRect();
    t.style.transition = "width " + s + "s linear"; t.style.width = "0";
    timerId = setTimeout(() => fail("Too slow!"), s * 1000);
  }
}

function answer(n) {
  if (!running) return;
  clearTimeout(timerId);
  if (n === current) {
    paths[n].setAttribute("class", "ok");
    setTimeout(() => { if (paths[n].getAttribute("class") === "ok") paths[n].setAttribute("class", ""); }, 1000);
    done++;
    next();
  } else {
    fail("That was " + n + ".");
  }
}

function fail(why) {
  running = false;
  clearTimeout(timerId);
  $("timer").style.transition = "none"; $("timer").style.width = "0";
  paths[current].setAttribute("class", "reveal");
  $("q").textContent = "Wrong, start over";
  $("msg").textContent = why + " The answer was " + (CAPITALS[current] && $("what").value === "cap" ? CAPITALS[current] + " = " : "") + current + ". You got " + done + ". Press Start to restart.";
}
